# Reconstruit le site après chaque enregistrement depuis la page /admin.
# Déclenché quand data/content.json change : met à jour les pages françaises,
# la version anglaise (en/) et enregistre le résultat sur GitHub.
name: Mise à jour du site (admin)

on:
  push:
    branches: [main]
    paths:
      - "data/content.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admin-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruire les pages
        run: |
          python tools/build_content.py
          python tools/build_en.py
      - name: Enregistrer les pages mises à jour
        run: |
          git config user.name "EXAD Admin"
          git config user.email "admin-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien à mettre à jour"
          else
            git commit -m "Site mis à jour depuis l'administration"
            git pull --rebase origin main
            git push
          fi
      # Envoie le site à jour chez LWS (voir deploy-lws.yml pour la configuration)
      - name: Vérifier la configuration FTP
        id: ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -n "$FTP_SERVER" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Secrets FTP absents : pas d'envoi vers LWS"; fi
      - name: Envoyer le site chez LWS
        if: steps.ftp.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            tools/**
            README.md
            demarrer_serveur.bat
